<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peredaran Darah Manusia</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>

<style>
body {
    font-family: 'Fredoka One', cursive;
    text-align: center;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Background blur */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('./assets/textures/background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(5px);
    z-index: -1;
}

/* Music button */
.music-btn {
    position: fixed;
	right: 40px;
    top: 15px;
    width: 55px;
    height: 55px;
    background: #FFD700;
    border: 2px solid #003366;
    border-radius: 50%;
    font-size: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 30;
    transition: 0.25s;
    color: #003366;
}

.music-btn.playing {
    background: #b50400;
    color: white;
    transform: scale(1.1);
}

.container {
    padding: 20px;
    width: 100%;
    max-width: 600px;
}

h1 {
    font-size: 22px;
    color: #FFD700;
    text-transform: uppercase;
    margin: 0;
    text-shadow: 
        -2px -2px 0 #003366,
        2px -2px 0 #003366,
        -2px 2px 0 #003366,
        2px 2px 0 #003366;
    letter-spacing: 3px;
}

h2 {
    font-size: 34px;
    color: #ffffff;
    text-transform: uppercase;
    margin: 5px 0;
    text-shadow:
        -2px -2px 0 #003366,
        2px -2px 0 #003366,
        -2px 2px 0 #003366,
        2px 2px 0 #003366;
    letter-spacing: 3px;
}

h3 {
    font-size: 14px;
    color: #FFD700;
    margin-top: 10px;
    text-shadow:
        -1px -1px 0 #003366,
        1px -1px 0 #003366,
        -1px 1px 0 #003366,
        1px 1px 0 #003366;
}

.button-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    width: 100%;
    padding: 12px;
    border: 2px solid black;
    border-radius: 6px;
    background-color: white;
    font-family: 'Fredoka One', cursive;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background-color: #b50400;
    color: pink;
}

/* Footer credit */
footer {
    position: fixed;
    width: 90%;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #FFD700;
    text-shadow:
        -1px -1px 0 #003366,
        1px -1px 0 #003366,
        -1px 1px 0 #003366,
        1px 1px 0 #003366;
    letter-spacing: 1px;
    opacity: 0.95;
    user-select: none;
    z-index: 20;
}
</style>

<body>

    <!-- 🎵 MUSIC BUTTON -->
    <button id="musicButton" class="music-btn">🎵</button>
    <audio id="bgMusic" src="./assets/sounds/LaguTubuhSihat.mp3"></audio>

    <div class="container">
        <h1>KEMBARA DALAM TUBUH</h1>
        <h2>SISTEM <br> PEREDARAN DARAH</h2>
        <h3>Mari Kenali Jantung, Darah dan Salurannya</h3>

        <div class="button-container">
            <button onclick="location.href='./coding/organ.html'">KENALI ORGAN-ORGAN</button>
            <button onclick="location.href='./coding/caraPeredaranDarah.html'">CARA PEREDARAN DARAH</button>
            <button onclick="location.href='./coding/kuiz.html'">KUIZ</button>
            <button onclick="location.href='./coding/info.html'">INFO</button>
            <button onclick="location.href='./coding/exit.html'">KELUAR</button>
        </div>
    </div>

    <footer>
        © 2025 | Dicipta oleh Julizah Binti  Salleh <br> Projek FYP: Sistem Peredaran Darah Manusia (WebAR) | 60132968465 | julizahsalleh906@gmail.com
    </footer>

<script>
const musicBtn = document.getElementById("musicButton");
const bgMusic = document.getElementById("bgMusic");
let isPlaying = false;

musicBtn.addEventListener("click", () => {
    if (!isPlaying) {
        bgMusic.play();
        musicBtn.classList.add("playing");
        isPlaying = true;
    } else {
        bgMusic.pause();
        musicBtn.classList.remove("playing");
        isPlaying = false;
    }
});
</script>

</body>
</html>
